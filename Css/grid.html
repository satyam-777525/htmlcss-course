<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: rgb(2, 4, 72);
            height: 400px;
            width: 100%;
            gap: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 100px 100px 100px;
        }
        .container>div{
        background-color: blue;
            
     }
     #itemm1{
        background-color: green;
        grid-row-start: 1;
        grid-row-end: 4;
     }
     #itemm2{
        grid-column-start: 2;
        grid-column-end: 4;
        background-color: green;
     }
     #itemm3{
        background-color: rgb(161, 7, 7);
     }
    #itemm4{
        background-color: rgb(164, 164, 11);
    }
    #itemm5{
        background-color: rgb(161, 7, 7);
    }
    #itemm6{
        grid-row-start: 2;
        grid-row-end: 4;
        grid-column-start: 4;
        grid-column-end: 5;
    }
    #itemm7{
        background-color: rgb(161, 7, 7);
    }
    #itemm8{
        background-color: rgb(164, 164, 11);
    }

    </style>
</head>
<body>
    <div class="container">
        <div class="item1" id="itemm1">item1</div>
        <div class="item2" id="itemm2">item2</div>
        <div class="item3" id="itemm3">item3</div>
        <div class="item4" id="itemm4">item4</div>
        <div class="item5" id="itemm5">item5</div>
        <div class="item6" id="itemm6">item6</div>
        <div class="item7" id="itemm7">item7</div>
        <div class="item8" id="itemm8">item8</div>
        
    </div>
    
</body>
</html>
