<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* rem - root element font size by default 16px */
        h1{
            font-size: 2rem; /*so basically this is 32px*/
        }
        div{
            width: 2rem;
            height: 3rem; /*this is 48px*/
        }
        

    </style>
</head>
<body>
    <h1>GLA UNIVERSITY</h1>
    <div>asdfghjk</div>
    
</body>
</html>
