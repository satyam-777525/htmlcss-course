<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinators css</title>
    <style>
        /* desendant */
       /* div p{ 
            color: red;
        } */
       


       /* child selectors */
        /* div>p{
            color: red;
        } */


      /* adjacent */
        /* div+p{
            color: red;
        } */

    /* general sibling */
    div~p{
        color: red;
    }

    




    </style>
</head>
<body>
    <h1>This is Combinators</h1>
    <p>Lorem ipsum dolor sit amet.</p>

    <div>
        <p>text content</p>
        <p>text content</p>
        <section>
            <p>hello</p>
            <p>hello</p>
        </section>
        <p>text content</p>
        <p>text content</p>
    </div>

    <p>after coming</p>
    <div>
        <h5>hello world</h5>
    </div>
    <p>after coming</p>
    <p>after coming</p>


    
</body>
</html>
