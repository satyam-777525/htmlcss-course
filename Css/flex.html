<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: aqua;
            width: 100%;
            height: 300px;
            
            display: flex;
            gap: 10px;
            justify-content:center; /*main axis ke through*/
            align-items: center; /* cross axis ke through*/
            flex-direction: row-reverse;
            flex-wrap: wrap;
            

        }
        .container>div{
            background-color: wheat;
            width: 100px;
            height: 50px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">item1</div>
        <div class="item">item2</div>
        <div class="item">item3</div>
        <div class="item">item4</div>
        <div class="item">item5</div>
    </div>
    
</body>
</html>
